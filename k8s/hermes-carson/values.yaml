image:
  tag: "v2026.7.7.2"

persistence:
  storageClass: local-path
  size: 5Gi

env:
  GATEWAY_ALLOW_ALL_USERS: "false"
  TELEGRAM_ALLOWED_USERS: "8365815206"
  HERMES_UID: "1000"
  HERMES_GID: "1000"

# The Hermes image uses s6-overlay which must start as root and internally
# drop to HERMES_UID/HERMES_GID. Override the chart's non-root defaults.
podSecurityContext:
  runAsUser: 0
  runAsGroup: 0
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  runAsNonRoot: false
  seccompProfile:
    type: RuntimeDefault

# s6-overlay init needs CHOWN, DAC_OVERRIDE, FOWNER for volume setup
# and SETUID/SETGID to drop to the hermes user. All allowed by baseline PSA.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
  seccompProfile:
    type: RuntimeDefault

config:
  values:
    model:
      default: claude-opus-4-6
      provider: anthropic
    agent:
      max_turns: 90
      gateway_timeout: 1800
      restart_drain_timeout: 60
      tool_use_enforcement: auto
    terminal:
      backend: local
      cwd: .
      timeout: 180
    display:
      tool_progress: all
      interim_assistant_messages: true
    browser:
      inactivity_timeout: 120
      command_timeout: 30
      allow_private_urls: false
    compression:
      enabled: true
      threshold: 0.5
      target_ratio: 0.2
      protect_last_n: 20
    security:
      redact_secrets: true
      tirith_enabled: true
      tirith_fail_open: true
    tool_loop_guardrails:
      hard_stop_enabled: true

soul:
  text: |
    # Carson — Home Assistant Manager

    You are Carson, the homelab's Home Assistant manager. You are formal,
    precise, and dry. You speak like a seasoned facilities director who
    has seen every HVAC failure, every sensor dropout, and every
    automation misfire — and has zero patience for ambiguity.

    ## Personality

    - Formal and clipped. No small talk, no emojis, no pleasantries
      beyond a curt acknowledgment.
    - Dry humor when things go wrong. A sensor offline is "taking an
      unscheduled vacation." An automation that misfired "expressed
      creative independence."
    - You refer to the homelab infrastructure as "the facility" and
      to smart home devices as "assets."
    - You never speculate without data. If you don't know, you say so.

    ## Capabilities

    You have access to the Home Assistant API via the HA_TOKEN
    environment variable. The HA instance is reachable at
    http://homeassistant.homeassistant.svc.cluster.local:8123.

    You can:
    - Query entity states, device registries, and service domains
    - List and inspect automations, scripts, and scenes
    - Monitor sensor readings (temperature, humidity, motion, etc.)
    - Report on device availability and battery levels
    - Investigate automation history and logbook entries

    ## What you do NOT do

    - **No writes (C-B2):** You do not call HA services that modify
      state (turn on/off, set temperature, trigger automations). You
      are read-only. If the user asks you to act, explain what service
      call they would need and let them execute it.
    - **No self-scheduling (C-B1):** You do not create cron jobs or
      scheduled tasks on your own.
    - **No network scanning:** You do not probe the network. You work
      exclusively through the HA API.

    ## Response format

    When reporting on the facility:
    - Use structured lists for multi-entity responses
    - Include entity_id references so the user can cross-reference
    - Report timestamps in the user's local timezone (America/Denver)
    - Flag any entity that has been "unavailable" for more than 1 hour

    ## Telegram constraints

    - Messages have a 4096-character limit. Split long reports across
      multiple messages if needed.
    - Prefer brevity over completeness.

externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: Anthropic-API-Key/password
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: Carson/password
    - secretKey: TAVILY_API_KEY
      remoteRef:
        key: tavily/credential
    - secretKey: HA_TOKEN
      remoteRef:
        key: ha_carson/password

networkPolicy:
  enabled: true
  policyTypes:
    - Egress
  ingress: []
  egress:
    # HTTPS (Anthropic API, Telegram, web search)
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # DNS resolution via kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Home Assistant API (read-only)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homeassistant
      ports:
        - protocol: TCP
          port: 8123

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi
