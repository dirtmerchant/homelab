apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-carson
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://github.com/dirtmerchant/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/dirtmerchant/homelab.git
      targetRevision: main
      path: k8s/hermes/chart
      helm:
        valueFiles:
          - $values/k8s/hermes-carson/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes-carson
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
