nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/dirtmerchant/observable-job-agent
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

env: {}

externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ""
  target:
    name: ""
    creationPolicy: Owner
    deletionPolicy: Retain
  data: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

service:
  type: ClusterIP
  port: 7860

ingressRoute:
  enabled: false
  host: ""

networkPolicy:
  enabled: false
  ingress: []
  egress: []

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
