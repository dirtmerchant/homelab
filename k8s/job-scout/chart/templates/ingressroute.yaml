{{- if .Values.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "job-scout.fullname" . }}
  labels:
    {{- include "job-scout.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - match: Host(`{{ .Values.ingressRoute.host }}`)
      kind: Rule
      middlewares:
        - name: security-headers
          namespace: traefik
      services:
        - name: {{ include "job-scout.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
